<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SlashSnip</title><link rel="stylesheet" href="popup.css"></head><body>
  <main class="app">
    <header><div><h1>SlashSnip</h1><p id="site">Current Site: checking…</p></div><button id="test">Test Insertion</button></header>
    <section id="health" class="card"></section>
    <input id="search" placeholder="Search snippets, shortcuts, categories…" autofocus>
    <div class="toolbar"><button id="new">Create snippet</button><button id="cancel" hidden>Cancel</button></div>
    <form id="form" class="card" hidden>
      <input name="title" placeholder="Title" required><input name="shortcut" placeholder="/shortcut" required><input name="category" placeholder="Category" required>
      <textarea name="content" placeholder="Content with {{name}}, {{date}}, {{time}}, {{clipboard}}" required></textarea>
      <label><input name="favorite" type="checkbox"> Favorite</label><button>Save snippet</button>
    </form>
    <section><h2>Favorites</h2><div id="favorites"></div></section><section><h2>Categories</h2><div id="categories"></div></section><section><h2>Recent snippets</h2><div id="recent"></div></section>
  </main><script src="storage.js"></script><script src="popup.js"></script>
</body></html>
